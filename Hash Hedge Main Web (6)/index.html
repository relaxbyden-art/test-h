<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HashHedge – Crypto Prop Trading Firm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="mobile.css?v=5" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="promo-how.jsx"></script>
<script type="text/babel" src="pricing-why.jsx"></script>
<script type="text/babel" src="news-tg.jsx"></script>
<script type="text/babel" src="support-blueprint.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
    "heroVariant": "classic",
    "animLevel": "max",
    "accentHue": 90
  }/*EDITMODE-END*/;

  function Nav({ onMenuOpen }) {
    return (
      <nav className="nav">
        <div className="container nav-inner">
          <HashHedgeLogo />
          <ul>
            <li><a href="#how">How it works</a></li>
            <li><a href="#pricing">Pricing</a></li>
            <li><a href="#why">Why us</a></li>
            <li><a href="#press">Press</a></li>
            <li><a href="#faq">FAQ</a></li>
          </ul>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <a href="https://www.hashhedge.com/client/index" target="_blank" rel="noopener" className="nav-cta-desktop" style={{fontSize:14,color:"var(--fg-muted)",padding:"10px 14px"}}>Log in</a>
            <a href="https://www.hashhedge.com/client/register" target="_blank" rel="noopener" className="btn btn-primary nav-cta-desktop">Start Challenge</a>
            <button className="nav-burger" onClick={onMenuOpen} aria-label="Open menu">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </nav>
    );
  }

  function MobileMenu({ open, onClose }) {
    React.useEffect(() => {
      if (open) document.body.style.overflow = "hidden";
      else document.body.style.overflow = "";
      return () => { document.body.style.overflow = ""; };
    }, [open]);
    const close = (e) => { onClose(); };
    return (
      <div className={"mobile-menu" + (open ? " open" : "")}>
        <button className="mobile-menu-close" onClick={close} aria-label="Close menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>
        <a href="#how" onClick={close}>How it works</a>
        <a href="#pricing" onClick={close}>Pricing</a>
        <a href="#why" onClick={close}>Why us</a>
        <a href="#press" onClick={close}>Press</a>
        <a href="#faq" onClick={close}>FAQ</a>
        <div className="menu-cta">
          <a href="https://www.hashhedge.com/client/register" target="_blank" rel="noopener" className="btn btn-primary btn-lg" onClick={close}>Start Challenge · from $79</a>
          <a href="https://www.hashhedge.com/client/index" target="_blank" rel="noopener" className="btn btn-ghost" onClick={close}>Log in</a>
        </div>
      </div>
    );
  }

  function MobileCTABar() {
    return (
      <div className="mobile-cta-bar">
        <a href="https://www.hashhedge.com/client/register" target="_blank" rel="noopener" className="btn btn-primary">
          Start Challenge · from $79
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </a>
      </div>
    );
  }

  function App() {
    const [values, setKey] = useTweaks(TWEAK_DEFAULS);
    const [menuOpen, setMenuOpen] = React.useState(false);
    React.useEffect(() => {
      // Only override accent if user actually changed the slider; default keeps Figma yellow
      if (values.accentHue !== 90) {
        const hue = values.accentHue;
        document.documentElement.style.setProperty('--accent', `oklch(0.86 0.17 ${hue})`);
        document.documentElement.style.setProperty('--accent-dark', `oklch(0.72 0.18 ${hue})`);
      } else {
        document.documentElement.style.setProperty('--accent', '#fcd535');
        document.documentElement.style.setProperty('--accent-dark', '#cbaa22');
      }
      document.body.setAttribute('data-anim', values.animLevel);
    }, [values.accentHue, values.animLevel]);

    return (
      <>
        <Nav onMenuOpen={() => setMenuOpen(true)} />
        <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} />
        <Hero variant={values.heroVariant} anim={values.animLevel} />
        <PressStrip />
        <PromoBanner />
        <HowItWorks />
        <Pricing />
        <WhyUs />
        <PayoutShowcase />
        <TeamCerts />
        <TelegramCommunity />
        <Reviews />
        <YouTubeSection />
        <InvestingBanner />
        <BlueprintSection />
        <SupportSection />
        <FAQ />
        <BigCTA />
        <Footer />

        <MobileCTABar />

        <TweaksPanel title="Tweaks">
          <TweakSection title="Hero">
            <TweakRadio label="Variant" value={values.heroVariant} onChange={v=>setKey('heroVariant', v)}
              options={[
                {value:"classic", label:"Classic · live payouts"},
                {value:"terminal", label:"Terminal · trade feed"},
                {value:"cosmic", label:"Cosmic · full-bleed"},
              ]}
            />
          </TweakSection>
          <TweakSection title="Motion">
            <TweakRadio label="Animation level" value={values.animLevel} onChange={v=>setKey('animLevel', v)}
              options={[
                {value:"low", label:"Low · minimal"},
                {value:"medium", label:"Medium"},
                {value:"max", label:"Max · particles + grid"},
              ]}
            />
          </TweakSection>
          <TweakSection title="Accent (brand = 90)">
            <TweakSlider label="Hue" min={20} max={320} step={1} value={values.accentHue} onChange={v=>setKey('accentHue', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
