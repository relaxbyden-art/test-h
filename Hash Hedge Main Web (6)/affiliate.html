<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HashHedge – Affiliate Program · Earn up to 80% for life</title>
<meta name="description" content="Join the HashHedge affiliate program. Earn up to 80% of HashHedge profits — for life — from every crypto trader you refer. Weekly USDT payouts, lifetime accruals, 154 countries." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="mobile.css?v=5" />
</head>
<body>
<div id="root"></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="aff-top.jsx"></script>
<script type="text/babel" src="aff-bottom.jsx"></script>

<script type="text/babel">
  const AFF_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "animLevel": "medium",
    "accentHue": 90,
    "avgRevenue": 140
  }/*EDITMODE-END*/;

  const SIGNUP = "https://partner.hashhedge.com/auth/signup/";
  const PORTAL = "https://partner.hashhedge.com/";

  function AffNav({ onMenuOpen }) {
    return (
      <nav className="nav">
        <div className="container nav-inner">
          <HashHedgeLogo />
          <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#how">How it works</a></li>
            <li><a href="#tiers">Earnings</a></li>
            <li><a href="#faq">FAQ</a></li>
            <li><a href="index.html">Trading challenge ↗</a></li>
          </ul>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <a href={PORTAL} target="_blank" rel="noopener" className="nav-cta-desktop" style={{fontSize:14,color:"var(--fg-muted)",padding:"10px 14px"}}>Log in</a>
            <a href={SIGNUP} target="_blank" rel="noopener" className="btn btn-primary nav-cta-desktop">Start earning</a>
            <button className="nav-burger" onClick={onMenuOpen} aria-label="Open menu">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </nav>
    );
  }

  function AffMobileMenu({ open, onClose }) {
    React.useEffect(() => {
      if (open) document.body.style.overflow = "hidden";
      else document.body.style.overflow = "";
      return () => { document.body.style.overflow = ""; };
    }, [open]);
    const close = () => { onClose(); };
    return (
      <div className={"mobile-menu" + (open ? " open" : "")}>
        <button className="mobile-menu-close" onClick={close} aria-label="Close menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>
        <a href="#about" onClick={close}>About</a>
        <a href="#how" onClick={close}>How it works</a>
        <a href="#tiers" onClick={close}>Earnings</a>
        <a href="#faq" onClick={close}>FAQ</a>
        <a href="index.html" onClick={close}>Trading challenge ↗</a>
        <div className="menu-cta">
          <a href={SIGNUP} target="_blank" rel="noopener" className="btn btn-primary btn-lg" onClick={close}>Start earning</a>
          <a href={PORTAL} target="_blank" rel="noopener" className="btn btn-ghost" onClick={close}>Log in</a>
        </div>
      </div>
    );
  }

  function AffMobileCTABar() {
    return (
      <div className="mobile-cta-bar">
        <a href={SIGNUP} target="_blank" rel="noopener" className="btn btn-primary">
          Start earning · up to 80%
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </a>
      </div>
    );
  }

  function App() {
    const [values, setKey] = useTweaks(AFF_TWEAK_DEFAULTS);
    const [menuOpen, setMenuOpen] = React.useState(false);
    React.useEffect(() => {
      if (values.accentHue !== 90) {
        const hue = values.accentHue;
        document.documentElement.style.setProperty('--accent', `oklch(0.86 0.17 ${hue})`);
        document.documentElement.style.setProperty('--accent-dark', `oklch(0.72 0.18 ${hue})`);
      } else {
        document.documentElement.style.setProperty('--accent', '#fcd535');
        document.documentElement.style.setProperty('--accent-dark', '#cbaa22');
      }
      document.body.setAttribute('data-anim', values.animLevel);
    }, [values.accentHue, values.animLevel]);

    return (
      <>
        <AffNav onMenuOpen={() => setMenuOpen(true)} />
        <AffMobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} />
        <AffHero />
        <HighestTerms />
        <WhyBeneficial />
        <StartEarning />
        <CommissionLadder avgRevenue={values.avgRevenue} />
        <EventsGallery />
        <PersonalManager />
        <AffFAQ />
        <AffBigCTA />
        <Footer />

        <AffMobileCTABar />

        <TweaksPanel title="Tweaks">
          <TweakSection title="Motion">
            <TweakRadio label="Animation level" value={values.animLevel} onChange={v=>setKey('animLevel', v)}
              options={[
                {value:"low", label:"Low · minimal"},
                {value:"medium", label:"Medium"},
                {value:"max", label:"Max · live panel"},
              ]}
            />
          </TweakSection>
          <TweakSection title="Earnings calculator">
            <TweakSlider label="Avg. monthly revenue / trader ($)" min={60} max={300} step={10} value={values.avgRevenue} onChange={v=>setKey('avgRevenue', v)} />
          </TweakSection>
          <TweakSection title="Accent (brand = 90)">
            <TweakSlider label="Hue" min={20} max={320} step={1} value={values.accentHue} onChange={v=>setKey('accentHue', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
