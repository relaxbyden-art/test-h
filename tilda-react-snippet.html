<div id="hashhedge-root"></div>
<script>
(function(){
  var v = "20260512-main";
  var base = "https://cdn.jsdelivr.net/gh/relaxbyden-art/hash-hedge@main/";
  window.__HH_BASE__ = base;
  var root = document.getElementById("hashhedge-root");

  function loadCss(href){
    return new Promise(function(resolve){
      if (document.querySelector('link[href="' + href + '"]')) return resolve();
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.href = href;
      l.onload = resolve; l.onerror = resolve;
      document.head.appendChild(l);
    });
  }

  function loadScript(src){
    return new Promise(function(resolve, reject){
      if (document.querySelector('script[src="' + src + '"]')) return resolve();
      var s = document.createElement("script");
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = function(){ reject(new Error("Failed: " + src)); };
      document.head.appendChild(s);
    });
  }

  function loadFirst(urls){
    var chain = Promise.reject();
    urls.forEach(function(url){
      chain = chain.catch(function(){ return loadScript(url); });
    });
    return chain;
  }

  loadCss("https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap");
  loadCss(base + "hashhedge-react.css?v=" + v);

  loadFirst([
    "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js"
  ])
    .then(function(){
      return loadFirst([
        "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
        "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      ]);
    })
    .then(function(){ return loadScript(base + "hashhedge-react-app.js?v=" + v); })
    .catch(function(err){
      console.error("HashHedge loader failed", err);
      if (root && !root.childNodes.length) {
        root.innerHTML = '<div style="min-height:320px;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f5f1e8;font:600 18px system-ui,sans-serif;text-align:center;padding:32px;">HashHedge failed to load. Refresh the page.</div>';
      }
    });
})();
</script>
