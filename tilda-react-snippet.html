<div id="hashhedge-root"></div>
<script>
(function(){
  var base = "https://cdn.jsdelivr.net/gh/relaxbyden-art/hash-hedge@hh-2026-05-12-desktop-spacing-3/";
  window.__HH_BASE__ = base;
  var root = document.getElementById("hashhedge-root");

  function loadCss(href){
    return new Promise(function(resolve){
      if (document.querySelector('link[href="' + href + '"]')) return resolve();
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = href;
      l.onload = resolve;
      l.onerror = resolve;
      document.head.appendChild(l);
    });
  }

  function loadScript(src, timeoutMs){
    return new Promise(function(resolve, reject){
      if (document.querySelector('script[src="' + src + '"]')) return resolve();
      var s = document.createElement("script");
      var done = false;
      var timer = setTimeout(function(){
        if (done) return;
        done = true;
        s.onload = s.onerror = null;
        reject(new Error("Timed out loading " + src));
      }, timeoutMs || 12000);
      s.src = src;
      s.async = true;
      s.onload = function(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      };
      s.onerror = function(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error("Failed loading " + src));
      };
      document.head.appendChild(s);
    });
  }

  function loadFirst(urls){
    var chain = Promise.reject();
    urls.forEach(function(url){
      chain = chain.catch(function(){ return loadScript(url, 12000); });
    });
    return chain;
  }

  loadCss("https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap");
  loadCss(base + "hashhedge-react.css?v=20260512-desktop-spacing-3");

  loadFirst([
    "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js"
  ])
    .then(function(){
      return loadFirst([
        "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
        "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      ]);
    })
    .then(function(){ return loadScript(base + "hashhedge-react-app.js?v=20260512-desktop-spacing-3", 12000); })
    .catch(function(err){
      console.error("HashHedge loader failed", err);
      if (root && !root.childNodes.length) {
        root.innerHTML = '<div style="min-height:320px;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f5f1e8;font:600 18px system-ui,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:32px;">HashHedge failed to load. Refresh the page.</div>';
      }
    });
})();
</script>
